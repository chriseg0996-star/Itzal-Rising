name: CI

# Headless QA gates: boot the world (×3 factions), round-trip save/load, and
# verify audio assets — on every push and pull request. A gate "passes" only if
# it prints its OK token (the gates quit(0) on success; a script error aborts
# before the token, so a missing token == failure even if the process exits 0).

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: "4.6.3"

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download"
          ZIP="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL "${BASE}/${GODOT_VERSION}-stable/${ZIP}" -o godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          ./godot --version

      - name: Import project
        run: |
          set -euo pipefail
          # First headless run imports assets; it may exit non-zero on the
          # initial import, so don't fail the job here.
          ./godot --headless --path . --import || true

      - name: Run QA gates
        run: |
          set -uo pipefail
          GODOT="$PWD/godot"
          fail=0
          check() {  # name, token, log
            if echo "$3" | grep -q "$2"; then
              echo "✅ $1 PASS"
            else
              echo "❌ $1 FAIL (missing $2)"; echo "$3"; fail=1
            fi
          }
          # Boot matrix: every map × every faction (catches map/faction-specific
          # boot regressions the single-map gate would miss).
          echo "::group::boot matrix (map × faction)"
          for map in "Jungle Basin" "Sunken Reef" "Azure Coast" "Volcanic Crags"; do
            for f in 0 1 2; do
              log="$(GATE_FACTION="$f" GATE_MAP="$map" "$GODOT" --headless --path . --script tools/gate_boot.gd 2>&1)"
              check "boot f${f} — ${map}" GATE_BOOT_OK "$log"
            done
          done
          echo "::endgroup::"
          # Campaign: each mission boots with its map/faction/difficulty and
          # modifier (enemy_eco_boost / fast_aggro) applied to the live world.
          echo "::group::campaign missions"
          for mid in m1 m2 m3 m4 m5 tutorial; do
            log="$(GATE_MISSION="$mid" "$GODOT" --headless --path . --script tools/gate_campaign.gd 2>&1)"
            check "campaign ${mid}" GATE_CAMPAIGN_OK "$log"
          done
          echo "::endgroup::"
          echo "::group::saveload + audio + unlock"
          check "saveload"     GATE_SAVELOAD_OK "$("$GODOT" --headless --path . --script tools/gate_saveload.gd 2>&1)"
          check "audio"        GATE_AUDIO_OK    "$("$GODOT" --headless --path . --script tools/gate_audio.gd 2>&1)"
          check "unlock chain" GATE_UNLOCK_OK   "$("$GODOT" --headless --path . --script tools/gate_unlock.gd 2>&1)"
          echo "::endgroup::"
          exit $fail
